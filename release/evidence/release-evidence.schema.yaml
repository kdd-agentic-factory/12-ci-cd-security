type: object
required:
  - release_id
  - repository
  - version
  - commit_sha
  - image_ref
  - checks
  - artifacts
properties:
  release_id:
    type: string
    description: Unique identifier for this release event

  repository:
    type: string
    description: Repository name

  version:
    type: string
    description: SemVer version string

  commit_sha:
    type: string
    description: Full or short git commit SHA

  image_ref:
    type: string
    description: Full Docker image reference including tag

  generated_at:
    type: string
    description: ISO 8601 timestamp of evidence generation

  checks:
    type: array
    items:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - passed
            - failed
            - skipped

  artifacts:
    type: array
    items:
      type: object
      required:
        - name
        - path
        - type
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum:
            - sbom
            - documentation
            - test-report
            - security-report
            - coverage-report
            - manifest
