target-version = "py311"
line-length = 100

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[format]
quote-style = "double"
indent-style = "space"
