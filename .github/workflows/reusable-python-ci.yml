name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
      working-directory:
        required: false
        type: string
        default: "."
      run-mypy:
        required: false
        type: boolean
        default: false
      min-coverage:
        required: false
        type: string
        default: "0"

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e ".[test]" 2>/dev/null || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov pytest-asyncio anyio httpx

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check . --output-format=github || true

      - name: Mypy
        if: ${{ inputs.run-mypy }}
        run: |
          pip install mypy
          mypy src --ignore-missing-imports || true

      - name: Pytest
        run: |
          pytest tests/ \
            --tb=short \
            -q \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --asyncio-mode=auto \
            2>/dev/null || \
          pytest tests/ \
            --tb=short \
            -q \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Enforce coverage threshold
        if: ${{ inputs.min-coverage != '0' }}
        run: |
          pip install coverage
          coverage report --fail-under=${{ inputs.min-coverage }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
