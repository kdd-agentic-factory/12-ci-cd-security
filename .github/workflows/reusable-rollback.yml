name: Reusable Rollback

on:
  workflow_call:
    inputs:
      deployment-name:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: "default"
      revision:
        required: false
        type: string
        default: "0"
    secrets:
      kubeconfig:
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.kubeconfig }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollback deployment
        run: |
          if [ "${{ inputs.revision }}" = "0" ]; then
            kubectl rollout undo deployment/${{ inputs.deployment-name }} \
              -n ${{ inputs.namespace }}
          else
            kubectl rollout undo deployment/${{ inputs.deployment-name }} \
              -n ${{ inputs.namespace }} \
              --to-revision=${{ inputs.revision }}
          fi

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ inputs.deployment-name }} \
            -n ${{ inputs.namespace }} --timeout=120s

      - name: Show rollout history
        run: |
          kubectl rollout history deployment/${{ inputs.deployment-name }} \
            -n ${{ inputs.namespace }}
