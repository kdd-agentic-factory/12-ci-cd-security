name: Reusable Full Platform Smoke Test

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: "staging"
      base-url:
        required: false
        type: string
        default: ""
      timeout-seconds:
        required: false
        type: string
        default: "60"

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest httpx

      - name: Run smoke tests
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BASE_URL: ${{ inputs.base-url }}
          TIMEOUT: ${{ inputs.timeout-seconds }}
        run: |
          if [ -f tests/smoke/test_smoke.py ]; then
            pytest tests/smoke/ -v --timeout=${{ inputs.timeout-seconds }}
          else
            echo "[smoke] No smoke tests found, skipping."
          fi

      - name: Health check
        if: ${{ inputs.base-url != '' }}
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            "${{ inputs.base-url }}/health" || \
          echo "[smoke] Health endpoint not reachable"
