name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      scan-container:
        required: false
        type: boolean
        default: false
      image-ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks full-history scan
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 --tmpfs /tmp:rw,nosuid,size=128m --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git /repo --log-opts=--all --gitleaks-ignore-path /repo/.gitleaksignore --redact=100 --no-banner --timeout 180

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  container-scan:
    if: ${{ inputs.scan-container }}
    runs-on: ubuntu-latest

    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
