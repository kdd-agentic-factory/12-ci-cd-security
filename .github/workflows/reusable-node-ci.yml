name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      run-build:
        required: false
        type: boolean
        default: true
      build-command:
        required: false
        type: string
        default: "npm run build"
      test-command:
        required: false
        type: string
        default: "npm test -- --passWithNoTests"

jobs:
  node-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present || true

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-command }}

      - name: Upload build artifacts
        if: ${{ inputs.run-build }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: ignore
