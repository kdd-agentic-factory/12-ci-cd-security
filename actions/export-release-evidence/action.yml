name: Export Release Evidence
description: Export structured release evidence for auditing

inputs:
  version:
    description: Release version
    required: true
  repository:
    description: Repository name
    required: false
    default: ${{ github.event.repository.name }}
  commit-sha:
    description: Git commit SHA
    required: false
    default: ${{ github.sha }}
  image-ref:
    description: Docker image reference
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Export evidence
      shell: bash
      run: |
        bash scripts/export-release-evidence.sh \
          "${{ inputs.version }}" \
          "${{ inputs.repository }}" \
          "${{ inputs.commit-sha }}" \
          "${{ inputs.image-ref }}"

    - name: Upload evidence
      uses: actions/upload-artifact@v4
      with:
        name: release-evidence-${{ inputs.version }}
        path: release/evidence/releases/${{ inputs.version }}/
